<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 380px;
      min-height: 500px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #333;
      overflow-x: hidden;
    }
    
    .container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 0 0 20px 20px;
      padding: 24px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }
    
    .header {
      text-align: center;
      margin-bottom: 24px;
      position: relative;
    }
    
    .header h2 {
      font-size: 24px;
      font-weight: 700;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }
    
    .header .subtitle {
      font-size: 14px;
      color: #666;
      font-weight: 400;
    }
    
    .status-card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: all 0.3s ease;
    }
    
    .status-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
    }
    
    .status {
      padding: 16px 24px;
      border-radius: 12px;
      text-align: center;
      font-weight: 600;
      font-size: 16px;
      position: relative;
      overflow: hidden;
    }
    
    .status::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.5s;
    }
    
    .status.monitoring {
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      color: white;
      box-shadow: 0 4px 15px rgba(79, 172, 254, 0.4);
    }
    
    .status.monitoring::before {
      left: 100%;
    }
    
    .status.stopped {
      background: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
      color: white;
      box-shadow: 0 4px 15px rgba(250, 112, 154, 0.4);
    }
    
    .tab-info {
      font-size: 12px;
      color: #666;
      text-align: center;
      margin-top: 12px;
      padding: 8px 16px;
      background: rgba(102, 126, 234, 0.1);
      border-radius: 20px;
      display: inline-block;
    }
    
    .controls {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }
    
    button {
      flex: 1;
      padding: 14px 20px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }
    
    button::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: width 0.3s ease, height 0.3s ease;
    }
    
    button:active::before {
      width: 300px;
      height: 300px;
    }
    
    .start-btn {
      background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
      color: white;
      box-shadow: 0 4px 15px rgba(17, 153, 142, 0.4);
    }
    
    .start-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(17, 153, 142, 0.6);
    }
    
    .stop-btn {
      background: linear-gradient(135deg, #fc466b 0%, #3f5efb 100%);
      color: white;
      box-shadow: 0 4px 15px rgba(252, 70, 107, 0.4);
    }
    
    .stop-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(252, 70, 107, 0.6);
    }
    
    .results {
      display: grid;
      gap: 16px;
    }
    
    .result-card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: all 0.3s ease;
    }
    
    .result-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
    }
    
    .result-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    
    .result-title {
      font-weight: 600;
      font-size: 16px;
      color: #2d3748;
    }
    
    .result-count {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      min-width: 24px;
      text-align: center;
    }
    
    .url-list {
      max-height: 180px;
      overflow-y: auto;
      border-radius: 12px;
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      padding: 2px;
    }
    
    .url-list-inner {
      background: white;
      border-radius: 10px;
      padding: 16px;
      max-height: 176px;
      overflow-y: auto;
    }
    
    .url-list::-webkit-scrollbar {
      width: 6px;
    }
    
    .url-list::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.1);
      border-radius: 3px;
    }
    
    .url-list::-webkit-scrollbar-thumb {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border-radius: 3px;
    }
    
    .url-item {
      margin-bottom: 12px;
      word-break: break-all;
      font-size: 11px;
      line-height: 1.4;
    }
    
    .cm-code {
      background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
      border: none;
      padding: 12px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(252, 182, 159, 0.3);
      position: relative;
      overflow: hidden;
    }
    
    .cm-code::before {
      content: '🎯';
      position: absolute;
      top: 8px;
      right: 8px;
      font-size: 16px;
    }
    
    .copy-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      font-size: 12px;
      padding: 10px 16px;
      border-radius: 20px;
      font-weight: 600;
      box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
      margin-top: 12px;
    }
    
    .copy-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(102, 126, 234, 0.6);
    }
    
    .export-btn {
      background: linear-gradient(135deg, #ff6b6b 0%, #feca57 100%);
      color: white;
      font-size: 12px;
      padding: 10px 16px;
      border-radius: 20px;
      font-weight: 600;
      box-shadow: 0 4px 15px rgba(255, 107, 107, 0.4);
      margin-top: 12px;
      margin-left: 8px;
    }
    
    .export-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(255, 107, 107, 0.6);
    }
    
    .auth-section {
      margin-bottom: 20px;
    }
    
    .auth-card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: all 0.3s ease;
    }
    
    .auth-status {
      text-align: center;
      font-weight: 600;
      font-size: 16px;
      margin-bottom: 12px;
      color: #666;
    }
    
    .auth-status.authenticated {
      color: #28a745;
    }
    
    .auth-btn {
      width: 100%;
      background: linear-gradient(135deg, #ea4335 0%, #fbbc05 25%, #34a853 50%, #4285f4 100%);
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    
    .auth-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(66, 133, 244, 0.4);
    }
    
    .auth-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    
    .user-info {
      margin-top: 12px;
      padding: 12px;
      background: rgba(40, 167, 69, 0.1);
      border-radius: 12px;
      font-size: 12px;
      color: #28a745;
    }
    
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #718096;
    }
    
    .empty-state .icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
    
    .pulse {
      animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.5; }
      100% { opacity: 1; }
    }
    
    .fade-in {
      animation: fadeIn 0.5s ease-in;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h2>Google CM Code Monitor</h2>
      <div class="subtitle">Track campaign manager codes in real-time</div>
    </div>
    
    <div class="status-card">
      <div id="status" class="status stopped">
        🔍 Not Monitoring
      </div>
      
      <div id="tabInfo" class="tab-info" style="display: none;">
        📊 Monitoring 0 tabs
      </div>
    </div>
    
    <div class="auth-section">
      <div id="authStatus" class="auth-card">
        <div class="auth-status">🔐 Not Authenticated</div>
        <button id="authBtn" class="auth-btn">🔑 Login with Google</button>
        <button id="logoutBtn" class="auth-btn" style="background: #6c757d; margin-top: 10px; display: none;">🔒 Logout</button>
        <div id="userInfo" class="user-info" style="display: none;"></div>
      </div>
    </div>
    
    <div class="controls">
      <button id="startBtn" class="start-btn">▶️ Start Monitoring</button>
      <button id="stopBtn" class="stop-btn" style="display: none;">⏹️ Stop Monitoring</button>
    </div>
    
    <div class="results">
      <div class="result-card">
        <div class="result-header">
          <div class="result-title">📡 Total Requests</div>
          <div id="totalCount" class="result-count">0</div>
        </div>
      </div>
      
      <div class="result-card">
        <div class="result-header">
          <div class="result-title">🎯 Ad Requests</div>
          <div id="adCount" class="result-count">0</div>
        </div>
      </div>
      
      <div class="result-card">
        <div class="result-header">
          <div class="result-title">🏆 CM Codes Found</div>
          <div id="cmCount" class="result-count">0</div>
        </div>
        <button id="copyBtn" class="copy-btn" style="display: none;">📋 Copy All Codes</button>
        <button id="exportBtn" class="export-btn" style="display: none;">📤 Export for API</button>
        <div id="cmCodes" class="url-list" style="display: none;">
          <div class="url-list-inner"></div>
        </div>
      </div>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
