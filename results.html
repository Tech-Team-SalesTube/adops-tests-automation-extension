<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Campaign Manager Results</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      color: #333;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 2px solid rgba(102, 126, 234, 0.2);
    }

    .header h1 {
      font-size: 32px;
      font-weight: 700;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 10px;
    }

    .header .subtitle {
      font-size: 16px;
      color: #666;
      font-weight: 400;
    }

    .section {
      margin-bottom: 30px;
    }

    .section-header {
      background: white;
      border-radius: 12px;
      padding: 20px;
      cursor: pointer;
      user-select: none;
      transition: all 0.3s ease;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .section-header:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
    }

    .section-title {
      font-size: 24px;
      font-weight: 600;
      color: #2d3748;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .section-count {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      min-width: 40px;
      text-align: center;
    }

    .chevron {
      font-size: 20px;
      transition: transform 0.3s ease;
      color: #667eea;
    }

    .section-header.collapsed .chevron {
      transform: rotate(-90deg);
    }

    .section-content {
      margin-top: 15px;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
    }

    .section-content.expanded {
      max-height: 2000px;
    }

    .code-item {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: all 0.3s ease;
    }

    .code-item:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
    }

    .code-link {
      word-break: break-all;
      font-size: 12px;
      line-height: 1.4;
      padding: 12px;
      background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
      border-radius: 8px;
      margin-bottom: 15px;
      font-family: 'Courier New', monospace;
      border: 1px solid rgba(252, 182, 159, 0.3);
    }

    .code-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }

    .code-table th {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 12px;
      text-align: left;
      font-weight: 600;
      font-size: 14px;
    }

    .code-table th:first-child {
      border-radius: 8px 0 0 0;
      width: 30%;
    }

    .code-table th:last-child {
      border-radius: 0 8px 0 0;
    }

    .code-table td {
      padding: 12px;
      border-bottom: 1px solid rgba(102, 126, 234, 0.1);
      font-size: 13px;
      line-height: 1.4;
    }

    .code-table tr:nth-child(even) td {
      background: rgba(102, 126, 234, 0.05);
    }

    .code-table tr:last-child td:first-child {
      border-radius: 0 0 0 8px;
    }

    .code-table tr:last-child td:last-child {
      border-radius: 0 0 8px 0;
    }

    .error-message {
      background: linear-gradient(135deg, #ff6b6b 0%, #feca57 100%);
      color: white;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-weight: 500;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #666;
    }

    .loading .spinner {
      font-size: 48px;
      margin-bottom: 16px;
      animation: spin 2s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: #718096;
    }

    .empty-state .icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Campaign Manager Results</h1>
    </div>

    <div id="loading" class="loading">
      <div class="spinner">🔄</div>
      <div>Ładowanie wyników...</div>
    </div>

    <div id="content" style="display: none;">
      <div class="section">
        <div class="section-header" data-section="click">
          <div class="section-title">
            🖱️ Kody kliknięć
            <span class="section-count" id="clickCount">0</span>
          </div>
          <div class="chevron" id="clickChevron">▼</div>
        </div>
        <div class="section-content expanded" id="clickContent">
          <div id="clickCodes"></div>
        </div>
      </div>

      <div class="section">
        <div class="section-header" data-section="view">
          <div class="section-title">
            👁️ Kody wyświetleń
            <span class="section-count" id="viewCount">0</span>
          </div>
          <div class="chevron" id="viewChevron">▼</div>
        </div>
        <div class="section-content expanded" id="viewContent">
          <div id="viewCodes"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="results.js"></script>
</body>
</html>
